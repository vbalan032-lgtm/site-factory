name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  factory:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Factory regression tests
        run: python -m unittest discover -s tests/factory -t . -p "test_*.py" -v
      - name: Bootstrap clean-room tests
        run: python -m unittest discover -s tests/bootstrap -p "test_*.py" -v
      - name: Validate skills
        run: python .agents/skills/shared/factory-contracts/scripts/validate_skills.py .agents/skills
      - name: Package and verify
        run: |
          python -m factory.bootstrap pack --output dist --apply
          python -c "from pathlib import Path; import subprocess; d=Path('dist'); a=next(d.glob('*.zip')); c=next(d.glob('*.sha256')); m=next(d.glob('*.manifest.json')); subprocess.run(['python','-m','factory.bootstrap','verify','--archive',str(a),'--checksum',str(c),'--manifest',str(m)],check=True)"

  starter:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    defaults:
      run:
        working-directory: templates/nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: templates/nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
